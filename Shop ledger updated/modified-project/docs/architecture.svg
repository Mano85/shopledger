<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger app architecture</title>
  <desc id="desc">Architecture of the ShopLedger browser UI, Express server, route files, library modules, configuration, and JSON data file, with the order creation flow highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="orderArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#e87524"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#526176}.group{font-size:17px;font-weight:700;letter-spacing:.5px;fill:#34445b}.box{fill:#fff;stroke:#bcc8d8;stroke-width:1.6;rx:12}.boxhead{font-size:17px;font-weight:700}.small{font-size:13px;fill:#526176}.tiny{font-size:12px;fill:#526176}.route{fill:#f4f7fb;stroke:#9eafc4;stroke-width:1.5;rx:10}.lib{fill:#f7f5ff;stroke:#b6a9e4;stroke-width:1.5;rx:10}.data{fill:#eef8f2;stroke:#8fc7a2;stroke-width:1.7;rx:12}.ui{fill:#edf6ff;stroke:#86b8e5;stroke-width:1.7;rx:12}.server{fill:#fff6e9;stroke:#e7bc76;stroke-width:1.8;rx:12}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.order{fill:none;stroke:#e87524;stroke-width:3.2;marker-end:url(#orderArrow)}.dash{stroke-dasharray:7 6}.label{font-size:12px;font-weight:600;fill:#526176}.orderLabel{font-size:12px;font-weight:700;fill:#bd5715}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#f8fafc"/>
  <text x="50" y="52" class="title">ShopLedger — app architecture</text>
  <text x="50" y="80" class="sub">Browser interface, Express routes, business logic, configuration, and JSON file storage</text>

  <!-- Browser UI -->
  <rect x="50" y="128" width="340" height="276" class="ui"/>
  <text x="74" y="160" class="group">BROWSER UI</text>
  <rect x="76" y="184" width="288" height="54" class="box"/>
  <text x="94" y="207" class="boxhead">public/index.html</text><text x="94" y="226" class="small">App page and tabs</text>
  <rect x="76" y="252" width="288" height="54" class="box"/>
  <text x="94" y="275" class="boxhead">public/js/app.js</text><text x="94" y="294" class="small">UI actions and API requests</text>
  <rect x="76" y="320" width="288" height="54" class="box"/>
  <text x="94" y="343" class="boxhead">public/css/style.css</text><text x="94" y="362" class="small">Page styling</text>

  <!-- Server -->
  <rect x="466" y="128" width="270" height="276" class="server"/>
  <text x="490" y="160" class="group">EXPRESS SERVER</text>
  <rect x="493" y="190" width="216" height="80" class="box"/>
  <text x="513" y="220" class="boxhead">server.js</text>
  <text x="513" y="243" class="small">Serves public/ and mounts</text><text x="513" y="260" class="small">the API routers</text>
  <rect x="493" y="296" width="216" height="76" class="box"/>
  <text x="513" y="326" class="boxhead">config.js</text>
  <text x="513" y="349" class="small">Port, shop, tax, defaults</text>

  <!-- Routes -->
  <rect x="806" y="128" width="348" height="484" fill="#f1f5f9" stroke="#c7d2df" stroke-width="1.5" rx="16"/>
  <text x="832" y="160" class="group">ROUTES/</text>
  <rect x="833" y="184" width="294" height="66" class="route"/>
  <text x="852" y="211" class="boxhead">products.js</text><text x="852" y="232" class="small">Products and active coupons</text>
  <rect x="833" y="267" width="294" height="82" fill="#fff7ed" stroke="#e87524" stroke-width="2.5" rx="10"/>
  <text x="852" y="295" class="boxhead">orders.js</text><text x="852" y="317" class="small">Create, list, retrieve, cancel orders</text><text x="852" y="337" class="orderLabel">ORDER FLOW ENTRY</text>
  <rect x="833" y="366" width="294" height="66" class="route"/>
  <text x="852" y="393" class="boxhead">customers.js</text><text x="852" y="414" class="small">Khata customers and settlements</text>
  <rect x="833" y="449" width="294" height="82" class="route"/>
  <text x="852" y="477" class="boxhead">reports.js</text><text x="852" y="499" class="small">Dashboard, GST, price preview, export</text>
  <text x="833" y="570" class="tiny">Mounted by server.js under /api</text>

  <!-- Lib -->
  <rect x="1216" y="128" width="334" height="690" fill="#f5f3ff" stroke="#c3b9e5" stroke-width="1.5" rx="16"/>
  <text x="1242" y="160" class="group">LIB/ MODULES</text>
  <rect x="1243" y="184" width="280" height="54" fill="#fff7ed" stroke="#e87524" stroke-width="2" rx="10"/>
  <text x="1261" y="207" class="boxhead">orders.js</text><text x="1261" y="226" class="small">Order rules</text>
  <rect x="1243" y="251" width="280" height="54" class="lib"/>
  <text x="1261" y="274" class="boxhead">inventory.js</text><text x="1261" y="293" class="small">Lookup, stock checks, reservation</text>
  <rect x="1243" y="318" width="280" height="54" class="lib"/>
  <text x="1261" y="341" class="boxhead">pricing.js</text><text x="1261" y="360" class="small">Subtotal, discount, GST totals</text>
  <rect x="1243" y="385" width="280" height="54" class="lib"/>
  <text x="1261" y="408" class="boxhead">coupons.js</text><text x="1261" y="427" class="small">Coupon validation and discounts</text>
  <rect x="1243" y="452" width="280" height="54" class="lib"/>
  <text x="1261" y="475" class="boxhead">tax.js</text><text x="1261" y="494" class="small">HSN GST rates and CGST/SGST</text>
  <rect x="1243" y="519" width="280" height="54" class="lib"/>
  <text x="1261" y="542" class="boxhead">ledger.js</text><text x="1261" y="561" class="small">Customer credit and settlements</text>
  <rect x="1243" y="586" width="280" height="54" class="lib"/>
  <text x="1261" y="609" class="boxhead">store.js</text><text x="1261" y="628" class="small">Reads/writes db.json and audit log</text>
  <rect x="1243" y="653" width="280" height="54" class="lib"/>
  <text x="1261" y="676" class="boxhead">reports.js</text><text x="1261" y="695" class="small">Dashboard and GST calculations</text>
  <rect x="1243" y="720" width="280" height="54" class="lib"/>
  <text x="1261" y="743" class="boxhead">invoice.js · dates.js</text><text x="1261" y="762" class="small">Printable invoice · date helpers</text>

  <!-- Data -->
  <rect x="466" y="504" width="270" height="164" class="data"/>
  <text x="490" y="536" class="group">LOCAL DATA</text>
  <rect x="493" y="557" width="216" height="80" class="box"/>
  <text x="513" y="586" class="boxhead">data/db.json</text>
  <text x="513" y="609" class="small">Products, orders, customers,</text><text x="513" y="626" class="small">settlements, audit log</text>

  <!-- General relationships -->
  <path d="M364 278 H493" class="edge"/><text x="398" y="266" class="label">browser requests</text>
  <path d="M709 228 H780 V217 H833" class="edge"/>
  <path d="M780 228 V308 H833" class="edge"/>
  <path d="M780 228 V399 H833" class="edge"/>
  <path d="M780 228 V490 H833" class="edge"/>
  <path d="M601 270 V296" class="edge dash"/><text x="614" y="288" class="label">settings</text>
  <path d="M709 334 H760 V580 H780 V613 H1243" class="edge dash"/><text x="777" y="568" class="label">data file access</text>

  <!-- Order creation flow -->
  <path d="M364 280 H430 V308 H833" class="order"/><text x="442" y="299" class="orderLabel">POST /api/orders</text>
  <path d="M1127 308 H1180 V211 H1243" class="order"/>
  <path d="M1127 308 H1165 V278 H1243" class="order"/>
  <path d="M1127 308 H1180 V345 H1243" class="order"/>
  <path d="M1127 308 H1170 V412 H1243" class="order"/>
  <path d="M1127 308 H1180 V479 H1243" class="order"/>
  <path d="M1127 308 H1180 V546 H1243" class="order"/>
  <path d="M1127 308 H1190 V613 H1243" class="order"/>
  <path d="M1523 613 H1560 V890 H602 V637" class="order"/><text x="939" y="880" class="orderLabel">read catalog/customer data · save order, stock, balance and audit updates</text>

  <!-- Legend -->
  <rect x="50" y="930" width="1500" height="76" fill="#fff" stroke="#d7dee8" rx="12"/>
  <path d="M82 968 H162" class="order"/><text x="178" y="973" class="small">Order creation flow</text>
  <path d="M382 968 H462" class="edge"/><text x="478" y="973" class="small">App request / connection</text>
  <path d="M740 968 H820" class="edge dash"/><text x="836" y="973" class="small">Configuration or data relationship</text>
  <text x="1176" y="973" class="tiny">Components and filenames match the project.</text>
</svg>
